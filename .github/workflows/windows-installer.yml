name: Windows installer

# Every save to main builds FMCC-Setup.exe on a Windows machine and publishes it as the newest release.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      MONGODB_VERSION: "7.0.14"
      FMLIBRE_TAG: "v0.5.0"
      FMCC_VERSION: "0.2.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Never ship preview settings or keys
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue backend/.env, frontend/.env

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the screens
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          CI: "false"
        run: |
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server and save reader
        run: |
          pip install -r desktop/requirements-desktop.txt
          pip install emergentintegrations --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Check the server loads with the packaged requirements
        shell: pwsh
        run: |
          $env:MONGO_URL = "mongodb://127.0.0.1:1"; $env:DB_NAME = "fmcc"; $env:FMCC_READER = "fmsave"
          python -c "import sys; sys.path.insert(0, 'backend'); import server; print('server loads')"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=FMCC server doesn't load::A package FMCC needs is missing from desktop/requirements-desktop.txt"; exit 1 }

      - name: Download the local database
        shell: pwsh
        run: |
          Invoke-WebRequest "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$env:MONGODB_VERSION.zip" -OutFile mongo.zip
          Expand-Archive mongo.zip -DestinationPath mongo
          New-Item -ItemType Directory -Force desktop/mongodb | Out-Null
          Copy-Item "mongo/mongodb-win32-x86_64-windows-$env:MONGODB_VERSION/bin/mongod.exe" desktop/mongodb/

      - name: Build FMLibreEditor's command-line tool (GPL-3.0)
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FMLIBRE_TAG https://github.com/tozmoz/FMLibreEditor.git fmlibre-src
          cargo build --release -p fmlibre-probe --manifest-path fmlibre-src/Cargo.toml
          New-Item -ItemType Directory -Force desktop/fmlibre | Out-Null
          Copy-Item fmlibre-src/target/release/fmlibre-probe.exe desktop/fmlibre/
          Copy-Item fmlibre-src/LICENSE* desktop/fmlibre/
          "FMLibreEditor $env:FMLIBRE_TAG command-line tool (fmlibre-probe), GPL-3.0. Source: https://github.com/tozmoz/FMLibreEditor/tree/$env:FMLIBRE_TAG" | Out-File desktop/fmlibre/SOURCE.txt
          desktop/fmlibre/fmlibre-probe.exe --help

      - name: Record the repository and version
        shell: pwsh
        run: |
          "${{ github.repository }}" | Out-File -Encoding ascii -NoNewline desktop/release_repo.txt
          "v$env:FMCC_VERSION" | Out-File -Encoding ascii -NoNewline desktop/version.txt

      - name: Package the program
        shell: pwsh
        run: |
          # The server's own modules are packaged as code so everything they use (FastAPI, the database driver, image and Excel tools) is bundled too.
          $mods = Get-ChildItem backend -Filter *.py | Where-Object { $_.BaseName -ne 'conftest' } | ForEach-Object { "--hidden-import=$($_.BaseName)" }
          pyinstaller desktop/launcher.py --name FMCC --noconsole --noconfirm --icon desktop/fmcc.ico --paths backend --paths desktop `
            --add-data "desktop/release_repo.txt;." --add-data "desktop/version.txt;." --add-data "desktop/loading-logo.png;." `
            --add-data "backend;backend" --add-data "backend/data;data" --add-data "frontend/build;web" --add-data "desktop/mongodb;mongodb" --add-data "desktop/fmlibre;fmlibre" `
            --collect-all fmsave --collect-all emergentintegrations --collect-submodules uvicorn --collect-all webview `
            --hidden-import motor --hidden-import psutil --hidden-import multipart --hidden-import python_multipart --hidden-import startup_pages @mods
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start the packaged program and check it answers
        shell: pwsh
        run: |
          $env:FMCC_DATA_DIR = Join-Path $env:RUNNER_TEMP "fmcc-selftest"
          $p = Start-Process dist/FMCC/FMCC.exe -ArgumentList "--selftest" -PassThru
          $null = $p.Handle  # keeps the exit code readable after the program ends
          $done = $p.WaitForExit(240000)
          if (-not $done) { $p.Kill(); $code = "timeout" } else { $code = $p.ExitCode }
          $log = Join-Path $env:FMCC_DATA_DIR "logs/fmcc-startup.log"
          $out = Join-Path $env:FMCC_DATA_DIR "logs/fmcc-output.log"
          $db = Join-Path $env:FMCC_DATA_DIR "db.log"
          $text = @()
          if (Test-Path $log) { $text += Get-Content $log -Tail 40 } else { $text += "No startup log was written (FMCC stopped before it could start logging)." }
          if (Test-Path $out) { $text += "--- output ---"; $text += Get-Content $out -Tail 40 }
          if ($code -ne 0 -and (Test-Path $db)) { $text += "--- data store ---"; $text += Get-Content $db -Tail 15 }
          $text | Write-Output
          $flat = ($text -join "%0A") -replace "::", ": :"
          if ($code -ne 0) {
            Write-Output "::error title=FMCC self-test failed (exit $code)::$flat"
            "## FMCC self-test failed (exit $code)`n``````n$($text -join "`n")`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          Write-Output "::notice title=FMCC self-test passed::$flat"

      - name: Smoke test the reader import
        run: python -c "import fmsave, sys; sys.path.insert(0, 'backend'); import fmsave_reader; print('fmsave', fmsave.__version__)"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc desktop/fmcc.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Name list for the Player Creator
        shell: pwsh
        run: |
          python -c "import json,os; d=json.load(open('release/fmcc-names.json',encoding='utf-8')); d['version']='v'+os.environ['FMCC_VERSION']; d.pop('sample',None); json.dump(d,open('dist-installer/fmcc-names.json','w',encoding='utf-8'),ensure_ascii=False)"

      - name: Release notes
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 2>$null
          $log = if ($prev) { git log "$prev..HEAD" --no-merges --pretty="- %s" } else { git log -n 20 --no-merges --pretty="- %s" }
          $log = $log | Where-Object { $_ -notmatch '(?i)checkpoint|auto-generated' } | ForEach-Object { $_ -replace '^- #+\s*', '- ' } | Select-Object -Unique -First 40
          @("FMCC v$env:FMCC_VERSION for Windows 10/11.", "", "Changes:") + $log + @("", "Windows may warn that the installer is from an unknown publisher (it isn't code-signed yet). Choose More info, then Run anyway.") | Out-File -Encoding utf8 notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: FMCC-Setup
          path: dist-installer/*

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FMCC_VERSION }}
          name: FMCC v${{ env.FMCC_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: "true"
          files: |
            dist-installer/FMCC-Setup.exe
            dist-installer/fmcc-names.json
