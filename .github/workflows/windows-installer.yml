name: Windows installer

# Every save to main builds FMCC-Setup.exe on a Windows machine and publishes it as the newest release.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      MONGODB_VERSION: "7.0.14"
      FMLIBRE_TAG: "v0.5.0"
      FMCC_VERSION: "0.2.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Never ship preview settings or keys
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue backend/.env, frontend/.env

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the screens
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          CI: "false"
        run: |
          yarn install --frozen-lockfile
          yarn build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server and save reader
        run: |
          pip install -r desktop/requirements-desktop.txt
          pip install emergentintegrations --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Download the local database
        shell: pwsh
        run: |
          Invoke-WebRequest "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$env:MONGODB_VERSION.zip" -OutFile mongo.zip
          Expand-Archive mongo.zip -DestinationPath mongo
          New-Item -ItemType Directory -Force desktop/mongodb | Out-Null
          Copy-Item "mongo/mongodb-win32-x86_64-windows-$env:MONGODB_VERSION/bin/mongod.exe" desktop/mongodb/

      - name: Build FMLibreEditor's command-line tool (GPL-3.0)
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FMLIBRE_TAG https://github.com/tozmoz/FMLibreEditor.git fmlibre-src
          cargo build --release -p fmlibre-probe --manifest-path fmlibre-src/Cargo.toml
          New-Item -ItemType Directory -Force desktop/fmlibre | Out-Null
          Copy-Item fmlibre-src/target/release/fmlibre-probe.exe desktop/fmlibre/
          Copy-Item fmlibre-src/LICENSE* desktop/fmlibre/
          "FMLibreEditor $env:FMLIBRE_TAG command-line tool (fmlibre-probe), GPL-3.0. Source: https://github.com/tozmoz/FMLibreEditor/tree/$env:FMLIBRE_TAG" | Out-File desktop/fmlibre/SOURCE.txt
          desktop/fmlibre/fmlibre-probe.exe --help

      - name: Record the repository and version
        shell: pwsh
        run: |
          "${{ github.repository }}" | Out-File -Encoding ascii -NoNewline desktop/release_repo.txt
          "v$env:FMCC_VERSION" | Out-File -Encoding ascii -NoNewline desktop/version.txt

      - name: Package the program
        run: >
          pyinstaller desktop/launcher.py --name FMCC --noconsole --noconfirm --icon desktop/fmcc.ico
          --add-data "desktop/release_repo.txt;." --add-data "desktop/version.txt;."
          --add-data "backend;backend" --add-data "frontend/build;web" --add-data "desktop/mongodb;mongodb" --add-data "desktop/fmlibre;fmlibre"
          --collect-all fmsave --collect-all emergentintegrations --collect-submodules uvicorn --hidden-import motor --hidden-import psutil

      - name: Smoke test the reader import
        run: python -c "import fmsave, sys; sys.path.insert(0, 'backend'); import fmsave_reader; print('fmsave', fmsave.__version__)"

      - name: Build the installer
        shell: pwsh
        run: iscc desktop/fmcc.iss

      - name: Name list for the Player Creator
        shell: pwsh
        run: |
          python -c "import json,os; d=json.load(open('release/fmcc-names.json',encoding='utf-8')); d['version']='v'+os.environ['FMCC_VERSION']; d.pop('sample',None); json.dump(d,open('dist-installer/fmcc-names.json','w',encoding='utf-8'),ensure_ascii=False)"

      - name: Release notes
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 2>$null
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD~20..HEAD" }
          $log = git log $range --no-merges --pretty="- %s" | Select-Object -First 40
          @("FMCC v$env:FMCC_VERSION for Windows 10/11.", "", "Changes:") + $log + @("", "Windows may warn that the installer is from an unknown publisher (it isn't code-signed yet). Choose More info, then Run anyway.") | Out-File -Encoding utf8 notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: FMCC-Setup
          path: dist-installer/*

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FMCC_VERSION }}
          name: FMCC v${{ env.FMCC_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: "true"
          files: |
            dist-installer/FMCC-Setup.exe
            dist-installer/fmcc-names.json
